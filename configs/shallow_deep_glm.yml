# Intent-routed shallow OR deep research workflow on a local Nemotron Ultra NIM.
#
# Mirrors configs/shallow_nemotron_ultra.yml but swaps the direct shallow-only
# workflow for the `chat_deepresearcher_agent` orchestrator:
#   intent_classifier -> (shallow_research_agent | deep_research_agent)
#
# The clarifier is disabled so runs never block on human-in-the-loop input.

general:
  telemetry:
    logging:
      console:
        _type: console
        level: INFO

  # Without this block NAT serves only the stock `/generate` and `/chat` routes.
  # The AI-Q async job API (`/v1/jobs/async/*`, SSE streaming, job ownership)
  # lives in the `aiq_api` front-end plugin, so any client that submits jobs
  # (frontends/ui, misc/aiq_inference.py) 404s unless this is present.
  front_end:
    _type: aiq_api
    runner_class: aiq_api.plugin.AIQAPIWorker
    # Async job infrastructure database (NAT JobStore + EventStore).
    # Needs an async driver: aiosqlite for SQLite, asyncpg for PostgreSQL.
    # Override with NAT_JOB_STORE_DB_URL.
    db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
    # How long completed jobs stay in the database before cleanup.
    expiry_seconds: 86400  # 24 hours (min: 600, max: 604800/7 days)
    cors:
      allow_origin_regex: 'http://localhost(:\d+)?|http://127.0.0.1(:\d+)?'
      allow_methods:
        - GET
        - POST
        - DELETE
        - OPTIONS
      allow_headers:
        - "*"
      allow_credentials: true
      expose_headers:
        - "*"

llms:
  intent_llm:
    _type: nim
    model_name: nvidia/zai-org/glm-5.2
    base_url: "https://inference-api.nvidia.com/v1"
    temperature: 0.5
    top_p: 0.9
    max_tokens: 4096
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: true

  research_llm:
    _type: nim
    model_name: nvidia/zai-org/glm-5.2
    base_url: "https://inference-api.nvidia.com/v1"
    temperature: 0.7
    top_p: 0.7
    max_tokens: 65536
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: true

functions:
  data_sources:
    _type: data_source_registry
    sources:
      - id: web_search
        name: Web Search
        description: Search the public web with Tavily and open specific pages.
        tools:
          - web_search_tool
          - advanced_web_search_tool
          - fetch_url_tool

  # Fast, shallow-friendly search.
  web_search_tool:
    _type: tavily_web_search
    include_answer: advanced
    advanced_search: true
    max_results: 5
    max_content_length: 10000

  # Deeper page content for the deep researcher.
  advanced_web_search_tool:
    _type: tavily_web_search
    advanced_search: true
    max_results: 2

  fetch_url_tool:
    _type: web_page_fetch
    max_urls_per_call: 4
    max_chars_per_page: 10000
    max_chars_per_call: 24000
    extract_depth: advanced

  # Routes each turn to shallow vs deep research (and handles meta responses).
  intent_classifier:
    _type: intent_classifier
    llm: intent_llm
    # tools omitted -> inherits all tools from data_source_registry
    verbose: false

  shallow_research_agent:
    _type: shallow_research_agent
    llm: research_llm
    exclude_tools:
      - advanced_web_search_tool
    max_llm_turns: 40
    max_tool_iterations: 20
    verbose: false

  deep_research_agent:
    _type: deep_research_agent
    orchestrator_llm: research_llm
    planner_llm: research_llm
    researcher_llm: research_llm
    writer_llm: research_llm
    source_router_llm: research_llm
    exclude_tools:
      - web_search_tool
    enable_citation_verification: true

workflow:
  _type: chat_deepresearcher_agent
  enable_escalation: true
  enable_clarifier: false
  checkpoint_db: ${AIQ_CHECKPOINT_DB:-./checkpoints.db}
