# Shallow Researcher + Foundational RAG configuration.
#
# Uses shallow_research_agent (bounded, fast research: direct + single_shot
# tiers only) paired with the FRAG knowledge layer. Escalation to deep
# research is disabled; only knowledge_search is active — no web search.
#
# Required env vars in deploy/.env:
#   NVIDIA_API_KEY
#   RAG_SERVER_URL, RAG_INGEST_URL
#   COLLECTION_NAME (defaults to kg_rag if unset)
#
# Compose: set BACKEND_CONFIG=/app/configs/config_shallow_frag.yml in deploy/.env

general:
  use_uvloop: true
  telemetry:
    logging:
      console:
        _type: console
        level: INFO

  front_end:
    _type: aiq_api
    runner_class: aiq_api.plugin.AIQAPIWorker
    db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
    expiry_seconds: 86400
    cors:
      allow_origin_regex: 'http://localhost(:\d+)?|http://127.0.0.1(:\d+)?'
      allow_methods:
        - GET
        - POST
        - DELETE
        - OPTIONS
      allow_headers:
        - "*"
      allow_credentials: true
      expose_headers:
        - "*"

llms:
  nemotron_super_llm:
    _type: nim
    # Inference Hub model details:
    # model_name: nvidia/nvidia/nemotron-3-ultra
    # base_url: "https://inference-api.nvidia.com/v1"
    model_name: nvidia/nemotron-3-ultra-550b-a55b
    base_url: "http://10.86.10.114:8999/v1"
    temperature: 0.7
    top_p: 0.7
    max_tokens: 65536
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: true

functions:
  # =========================================================================
  # Data Source Registry
  # =========================================================================
  # Only the knowledge_layer source is registered here. This means:
  #   - The UI shows a single "Knowledge Base" toggle (no web search toggle).
  #   - Agents with no explicit `tools` list inherit only knowledge_search.
  # =========================================================================
  data_sources:
    _type: data_source_registry
    sources:
      - id: knowledge_layer
        name: "Knowledge Base"
        description: "Search uploaded documents and files."
        tools:
          - knowledge_search

  # Knowledge Retrieval (see sources/knowledge_layer/KNOWLEDGE-LAYER-SETUP.md)
  knowledge_search:
    _type: knowledge_retrieval
    backend: foundational_rag
    collection_name: ${COLLECTION_NAME:-kg_rag}
    top_k: 3
    rag_url: ${RAG_SERVER_URL:-http://localhost:8081}
    ingest_url: ${RAG_INGEST_URL:-http://localhost:8082}
    timeout: 300

  # =========================================================================
  # Agents
  # =========================================================================
  intent_classifier:
    _type: intent_classifier
    llm: nemotron_super_llm
    # tools: omitted -> inherits knowledge_search from data_source_registry

  # Primary agent: lightweight, bounded research (direct + single_shot only).
  # Inherits knowledge_search from the registry; no web tools in scope.
  shallow_research_agent:
    _type: shallow_research_agent
    llm: nemotron_super_llm
    # tools: omitted -> inherits knowledge_search from data_source_registry
    max_llm_turns: 10
    max_tool_iterations: 5

  # Required by the chat_deepresearcher_agent workflow at startup even when
  # enable_escalation is false. It will never be invoked at runtime for this
  # shallow-only configuration. Inherits knowledge_search from the registry.
  deep_research_agent:
    _type: deep_research_agent
    enable_citation_verification: true
    orchestrator_llm: nemotron_super_llm
    source_router_llm: nemotron_super_llm
    researcher_llm: nemotron_super_llm
    planner_llm: nemotron_super_llm
    writer_llm: nemotron_super_llm
    # tools: omitted -> inherits knowledge_search from data_source_registry

workflow:
  _type: chat_deepresearcher_agent
  enable_escalation: false  # stay in shallow_research_agent; never hand off to deep_research_agent
  enable_clarifier: false   # skip the clarifier agent turn
  checkpoint_db: ${AIQ_CHECKPOINT_DB:-./checkpoints.db}
