# Direct shallow-research workflow for DeepSearchQA Harbor evaluations.

general:
  telemetry:
    logging:
      console:
        _type: console
        level: WARNING

llms:
  research_llm:
    _type: nim
    model_name: nvidia/nemotron-3-ultra-550b-a55b
    base_url: "http://10.86.10.114:8999/v1"
    temperature: 0.7
    top_p: 0.7
    max_tokens: 65536
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: true

functions:
  data_sources:
    _type: data_source_registry
    sources:
      - id: web_search
        name: Web Search
        description: Search the public web with Tavily.
        tools:
          - web_search_tool

  web_search_tool:
    _type: tavily_web_search
    include_answer: advanced
    advanced_search: true
    max_results: 5
    max_content_length: 10000

  shallow_research_agent:
    _type: shallow_research_agent
    llm: research_llm
    max_llm_turns: 10
    max_tool_iterations: 5
    verbose: false

workflow:
  _type: shallow_research_workflow
