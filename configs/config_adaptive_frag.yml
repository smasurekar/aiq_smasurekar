# Adaptive Researcher + Foundational RAG configuration.
#
# Combines the adaptive_research_workflow from config_adaptive_poc.yml with the
# FRAG knowledge layer from config_web_frag.yml.
#
# Required env vars in deploy/.env:
#   NVIDIA_API_KEY, TAVILY_API_KEY
#   RAG_SERVER_URL, RAG_INGEST_URL
#   COLLECTION_NAME (defaults to kg_rag if unset)
#
# Compose: set BACKEND_CONFIG=/app/configs/config_adaptive_frag.yml in deploy/.env

general:
  use_uvloop: true
  telemetry:
    logging:
      console:
        _type: console
        level: INFO

  front_end:
    _type: aiq_api
    runner_class: aiq_api.plugin.AIQAPIWorker
    db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
    expiry_seconds: 86400
    cors:
      allow_origin_regex: 'http://localhost(:\d+)?|http://127.0.0.1(:\d+)?'
      allow_methods:
        - GET
        - POST
        - DELETE
        - OPTIONS
      allow_headers:
        - "*"
      allow_credentials: true
      expose_headers:
        - "*"

llms:
  nemotron_super_llm:
    _type: nim
    # Inference Hub model details:
    model_name: nvidia/nvidia/nemotron-3-ultra
    # model_name: nvidia/zai-org/glm-5.2
    base_url: "https://inference-api.nvidia.com/v1"
    # Self deployed model details:
    # model_name: nvidia/nemotron-3-ultra-550b-a55b
    # base_url: "http://10.86.10.114:8999/v1"
    # model_name: zai-org/glm-5.2
    # base_url: "http://10.86.10.114:8999/v1"
    # model_name: azure/openai/gpt-5.2-codex
    # base_url: "https://inference-api.nvidia.com/v1"
    temperature: 0.7
    top_p: 0.7
    max_tokens: 65536
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: true

functions:
  data_sources:
    _type: data_source_registry
    sources:
      - id: web_search
        name: "Web Search"
        description: "Search the web for real-time information."
        tools:
          - web_search_tool
          - advanced_web_search_tool
      - id: knowledge_layer
        name: "Knowledge Base"
        description: "Search uploaded documents and files."
        tools:
          - knowledge_search

  web_search_tool:
    _type: tavily_web_search
    max_results: 5
    max_content_length: 1000

  advanced_web_search_tool:
    _type: tavily_web_search
    max_results: 2
    advanced_search: true

  knowledge_search:
    _type: knowledge_retrieval
    backend: foundational_rag
    collection_name: ${COLLECTION_NAME:-kg_rag}
    top_k: 3
    rag_url: ${RAG_SERVER_URL:-http://localhost:8081}
    ingest_url: ${RAG_INGEST_URL:-http://localhost:8082}
    timeout: 300

  adaptive_research_agent:
    _type: adaptive_research_agent
    enable_citation_verification: true
    orchestrator_llm: nemotron_super_llm
    source_router_llm: nemotron_super_llm
    researcher_llm: nemotron_super_llm
    planner_llm: nemotron_super_llm
    writer_llm: nemotron_super_llm
    enabled_tiers: [direct, single_shot, standard, deep]
    enforce_tier_tools: false
    single_loop_single_shot: true
    single_shot_search_budget: 10
    dynamic_orchestrator_sections: true
    researcher_loop_guard:
      enabled: true
      source_call_budgets:
        low: 5
        medium: 10
        high: 20
      max_identical_source_calls: 2
      max_consecutive_thinks: 3
    # Request-wide termination envelope: bounds the whole top-level request (not just one
    # researcher). Without this a standard/deep run can spawn fresh run_research_batch calls
    # indefinitely — each new researcher invocation resets the per-researcher budget — so a query
    # for evidence the sources do not hold can run for hours. These finite budgets, the hard
    # workflow deadline, and the graph recursion ceiling guarantee a terminal state.
    request_termination:
      enabled: true
      standard:
        max_batch_calls: 3
        max_total_research_queries: 9
        max_orchestrator_turns: 24
      deep:
        max_batch_calls: 6
        max_total_research_queries: 24
        max_orchestrator_turns: 100
      max_identical_research_queries: 1
      workflow_timeout_seconds: 2400
      fallback_finalizer_timeout_seconds: 60
      recursion_limit: 250
    enable_source_router: false
    exclude_tools:
      # - web_search_tool
      # - advanced_web_search_tool
      - knowledge_search

workflow:
  _type: adaptive_research_workflow
